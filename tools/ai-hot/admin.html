<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>热点管理 | SoftCloud</title><link rel="stylesheet" href="/tools/shared/tools.css"><script>try{document.documentElement.dataset.theme=localStorage.getItem('softcloud-theme-blue')||'light'}catch{}</script></head><body><header class="header"><div class="nav"><a class="brand" href="/"><img src="/assets/brand-icon.png" alt=""><span>softcloud.</span></a><small>热点管理</small><nav><a href="./">返回阅读</a></nav></div></header><main class="wrap"><div class="intro"><p class="eyebrow">SOFTCLOUD / EDITOR'S DESK</p><h1>关注信源，查看运行。</h1></div><section class="panel" id="login"><form id="login-form"><label class="field">管理员访问密钥<input id="token" type="password" autocomplete="off" required minlength="24"></label><button type="submit">进入管理</button><p class="hint">密钥只留在当前页面内存中，关闭页面后需要重新输入。</p></form></section><p class="notice" id="notice" role="status"></p><section id="dashboard" hidden><div class="row"><button id="reload" type="button">刷新状态</button><button id="logout" type="button" class="secondary">退出管理</button></div><div class="panel"><h2>今日处理额度</h2><p id="budget"></p><p class="hint">模型只在后台任务中运行。每日预算最多 6,000 Neurons，以保守上限预留；调用失败也占用预留额度。启用前需确认账户为 Workers Free。免费额度同时由账户内其他应用共享。</p></div><h2 style="margin-top:28px">信源状态</h2><div id="sources" class="result-list"></div><h2 style="margin-top:28px">运行记录</h2><div id="runs" class="result-list"></div><h2 style="margin-top:28px">需要检查的内容</h2><div id="failed" class="result-list"></div></section></main><script type="module" src="./admin.js"></script></body></html>
